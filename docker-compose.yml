services:
  api:
    image: creditwise-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/creditwise_model.joblib
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ui:
    image: creditwise-ui
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-off training job: `docker compose run --rm train`
  # Trains inside the same image the API runs in, so the saved model always
  # matches the scikit-learn version that loads it.
  train:
    image: creditwise-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    profiles: ["train"]
    user: root
    command: ["python", "-m", "src.train"]
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
